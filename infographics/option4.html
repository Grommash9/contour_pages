<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #root { width: 1200px; height: 1500px; overflow: hidden; }
</style>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/htm.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { html, T, Chair, GlowDefs, mount } = UI;

function Box({ children, bg = "#EEF2F9" }) {
  return html`<div style=${{width:300,height:300,borderRadius:24,background:bg,position:'relative',overflow:'hidden',flex:'0 0 auto',display:'flex',alignItems:'center',justifyContent:'center'}}>${children}</div>`;
}

function StepReference() {
  return html`<${Box}>
    <div style=${{width:'54%',height:'66%'}}><${Chair} mode="photo" color=${T.accent} /></div>
    <div style=${{position:'absolute',right:60,bottom:54,width:30,height:30,borderRadius:999,border:'4px solid '+T.green,background:'rgba(45,164,78,.25)'}}></div>
  </${Box}>`;
}

function StepAlign() {
  return html`<${Box} bg="#0e1320">
    <svg viewBox="0 0 1 1" style=${{width:0,height:0}}><${GlowDefs}/></svg>
    <div style=${{position:'absolute',left:'24%',top:'18%',width:'56%',height:'64%',opacity:.9}}><${Chair} mode="photo" color="#8f9fbd" /></div>
    <div style=${{position:'absolute',left:'28%',top:'15%',width:'56%',height:'64%'}}><${Chair} mode="line" color=${T.glow} glow=${true} /></div>
  </${Box}>`;
}

function StepCompare() {
  return html`<${Box}>
    <div style=${{position:'absolute',inset:0,display:'flex'}}>
      <div style=${{flex:1,background:'#E7ECF8',display:'flex',alignItems:'center',justifyContent:'center'}}><div style=${{width:'74%',height:'64%'}}><${Chair} mode="photo" color="#B9C0CC" /></div></div>
      <div style=${{flex:1,background:'#DDE6F7',display:'flex',alignItems:'center',justifyContent:'center'}}><div style=${{width:'74%',height:'64%'}}><${Chair} mode="photo" color=${T.accent} /></div></div>
    </div>
    <div style=${{position:'absolute',top:0,bottom:0,left:'50%',width:4,marginLeft:-2,background:'#fff'}}></div>
  </${Box}>`;
}

function Step({ n, illo, title, desc }) {
  return html`<div style=${{display:'flex',alignItems:'center',gap:34,background:T.card,borderRadius:30,padding:28,boxShadow:'0 16px 38px rgba(20,30,60,.08)',marginBottom:24}}>
    ${illo}
    <div style=${{flex:1}}>
      <div style=${{display:'flex',alignItems:'center',gap:16,marginBottom:14}}>
        <div style=${{width:54,height:54,borderRadius:999,background:T.accent,color:'#fff',fontSize:28,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>${n}</div>
        <div style=${{fontSize:40,fontWeight:800,color:T.ink}}>${title}</div>
      </div>
      <div style=${{fontSize:25,color:T.sub,lineHeight:1.4}}>${desc}</div>
    </div>
  </div>`;
}

function App() {
  return html`<div style=${{width:1200,height:1500,background:T.paper,fontFamily:T.font,padding:'66px 60px 50px'}}>
    <div style=${{fontSize:62,fontWeight:800,color:T.ink,marginBottom:8}}>How Contour works</div>
    <div style=${{fontSize:26,color:T.sub,marginBottom:40}}>Three steps to the exact same shot.</div>

    <${Step} n="1" illo=${html`<${StepReference}/>`} title="Pick a reference"
      desc="Choose any photo — an old progress shot, or one you saw online." />
    <${Step} n="2" illo=${html`<${StepAlign}/>`} title="Line up the contours"
      desc="Its glowing outline projects over your live camera. Move until it snaps onto your subject." />
    <${Step} n="3" illo=${html`<${StepCompare}/>`} title="Capture & compare"
      desc="Shoot the matched frame, then slide between before & after — or make a clip." />

    <div style=${{textAlign:'center',marginTop:14,fontSize:28,fontWeight:800,color:T.ink,letterSpacing:2}}>CONTOUR</div>
  </div>`;
}
mount(html`<${App}/>`);
</script>
</body>
</html>
