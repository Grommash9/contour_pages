<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #root { width: 1320px; height: 2868px; overflow: hidden; }
</style>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/htm.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { html, T, Chair3D, mount } = UI;

function Box({ children, bg = "#EAF0FA" }) {
  return html`<div style=${{width:380,height:380,borderRadius:32,background:bg,position:'relative',overflow:'hidden',flex:'0 0 auto',display:'flex',alignItems:'center',justifyContent:'center'}}>${children}</div>`;
}

function Step({ n, illo, title, desc }) {
  return html`<div style=${{display:'flex',alignItems:'center',gap:48,background:'#fff',borderRadius:40,padding:40,boxShadow:'0 24px 60px rgba(20,30,60,.10)',marginBottom:44}}>
    ${illo}
    <div style=${{flex:1}}>
      <div style=${{display:'flex',alignItems:'center',gap:22,marginBottom:20}}>
        <div style=${{width:76,height:76,borderRadius:999,background:T.accent,color:'#fff',fontSize:42,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>${n}</div>
        <div style=${{fontSize:60,fontWeight:800,color:T.ink}}>${title}</div>
      </div>
      <div style=${{fontSize:38,color:T.sub,lineHeight:1.4}}>${desc}</div>
    </div>
  </div>`;
}

const USES = ["Instagram recreations","Gym & body progress","Weight loss","Plants & garden","Renovations & DIY","Furniture restoration","Hair & beard growth","Pregnancy bump","Art work-in-progress","Real estate staging"];

function App() {
  return html`<div style=${{width:1320,height:2868,background:T.paper,fontFamily:T.font,padding:'120px 80px'}}>
    <div style=${{fontSize:92,fontWeight:800,color:T.ink,marginBottom:14}}>How Contour works</div>
    <div style=${{fontSize:42,color:T.sub,marginBottom:70}}>Three steps to the exact same shot.</div>

    <${Step} n="1" title="Pick a reference"
      desc="Any photo — an old progress shot, or one you saw online."
      illo=${html`<${Box}>
        <div style=${{width:'78%',height:'78%'}}><${Chair3D} mode="photo" color="#C7903F"/></div>
        <div style=${{position:'absolute',right:74,bottom:70,width:38,height:38,borderRadius:999,border:'5px solid '+T.green,background:'rgba(45,164,78,.25)'}}></div>
      </${Box}>`} />

    <${Step} n="2" title="Line up the contours"
      desc="Its glowing outline projects over your live camera. Move until it snaps onto your subject."
      illo=${html`<${Box} bg="#0e1320">
        <div style=${{position:'absolute',left:'16%',top:'16%',width:'66%',height:'66%',opacity:.55}}><${Chair3D} mode="photo" color="#7f8db0"/></div>
        <div style=${{position:'absolute',left:'20%',top:'13%',width:'66%',height:'66%'}}><${Chair3D} mode="line" glow=${true}/></div>
      </${Box}>`} />

    <${Step} n="3" title="Capture & compare"
      desc="Shoot the matched frame, then slide between before & after — or make a clip."
      illo=${html`<${Box}>
        <div style=${{position:'absolute',inset:0,display:'flex'}}>
          <div style=${{flex:1,background:'#E7ECF8',display:'flex',alignItems:'center',justifyContent:'center'}}><div style=${{width:'82%',height:'78%'}}><${Chair3D} mode="photo" color="#AFb7c6"/></div></div>
          <div style=${{flex:1,background:'#DDE6F7',display:'flex',alignItems:'center',justifyContent:'center'}}><div style=${{width:'82%',height:'78%'}}><${Chair3D} mode="photo" color="#C7903F"/></div></div>
        </div>
        <div style=${{position:'absolute',top:0,bottom:0,left:'50%',width:6,marginLeft:-3,background:'#fff'}}></div>
      </${Box}>`} />

    <div style=${{marginTop:60}}>
      <div style=${{fontSize:48,fontWeight:800,color:T.ink,marginBottom:30}}>Great for</div>
      <div style=${{display:'flex',flexWrap:'wrap',gap:20}}>
        ${USES.map(u => html`<span key=${u} style=${{background:T.accentSoft,color:T.accent,fontSize:34,fontWeight:700,padding:'16px 30px',borderRadius:999}}>${u}</span>`)}
      </div>
    </div>

    <div style=${{textAlign:'center',marginTop:90,fontSize:46,fontWeight:800,color:T.ink,letterSpacing:3}}>CONTOUR</div>
  </div>`;
}
mount(html`<${App}/>`);
</script>
</body>
</html>
