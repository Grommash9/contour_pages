<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #root { width: 1320px; height: 2868px; overflow: hidden; }
</style>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/htm.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { html, T, Chair3D, mount } = UI;

function Box({ children, bg = "#0e1320" }) {
  return html`<div style=${{width:380,height:380,borderRadius:32,background:bg,position:'relative',overflow:'hidden',flex:'0 0 auto',display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid rgba(255,255,255,.08)'}}>${children}</div>`;
}
function Step({ n, illo, title, desc }) {
  return html`<div style=${{display:'flex',alignItems:'center',gap:48,background:'#141a28',border:'1px solid rgba(255,255,255,.08)',borderRadius:40,padding:40,marginBottom:44}}>
    ${illo}
    <div style=${{flex:1}}>
      <div style=${{display:'flex',alignItems:'center',gap:22,marginBottom:20}}>
        <div style=${{width:76,height:76,borderRadius:999,background:T.glow,color:'#06202a',fontSize:42,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>${n}</div>
        <div style=${{fontSize:58,fontWeight:800,color:'#fff'}}>${title}</div>
      </div>
      <div style=${{fontSize:38,color:'#aeb9cc',lineHeight:1.4}}>${desc}</div>
    </div>
  </div>`;
}
const USES = ["Instagram recreations","Gym & body progress","Weight loss","Plants & garden","Renovations & DIY","Furniture restoration","Hair & beard growth","Pregnancy bump","Art work-in-progress","Real estate staging"];

function App() {
  return html`<div style=${{width:1320,height:2868,background:'linear-gradient(180deg,#070a12,#0d1322)',fontFamily:T.font,padding:'120px 80px'}}>
    <div style=${{fontSize:92,fontWeight:800,color:'#fff',marginBottom:14}}>How Contour works</div>
    <div style=${{fontSize:42,color:'#aeb9cc',marginBottom:70}}>Three steps to the exact same shot.</div>

    <${Step} n="1" title="Pick a reference"
      desc="Any photo — an old progress shot, or one you saw online."
      illo=${html`<${Box} bg="#101a2a">
        <div style=${{width:'80%',height:'80%'}}><${Chair3D} mode="photo" color="#C7903F"/></div>
      </${Box}>`} />

    <${Step} n="2" title="Line up the contours"
      desc="Its glowing outline projects over your live camera. Move until it snaps onto your subject."
      illo=${html`<${Box}>
        <div style=${{position:'absolute',left:'15%',top:'15%',width:'70%',height:'70%',opacity:.5}}><${Chair3D} mode="photo" color="#7f8db0"/></div>
        <div style=${{position:'absolute',left:'19%',top:'12%',width:'70%',height:'70%'}}><${Chair3D} mode="line" glow=${true}/></div>
      </${Box}>`} />

    <${Step} n="3" title="Capture & compare"
      desc="Shoot the matched frame, then slide between before & after — or make a clip."
      illo=${html`<${Box}>
        <div style=${{position:'absolute',inset:0,display:'flex'}}>
          <div style=${{flex:1,background:'#121826',display:'flex',alignItems:'center',justifyContent:'center'}}><div style=${{width:'84%',height:'80%'}}><${Chair3D} mode="photo" color="#5a6b80"/></div></div>
          <div style=${{flex:1,background:'#0e1422',display:'flex',alignItems:'center',justifyContent:'center'}}><div style=${{width:'84%',height:'80%'}}><${Chair3D} mode="photo" color="#C7903F"/></div></div>
        </div>
        <div style=${{position:'absolute',top:0,bottom:0,left:'50%',width:6,marginLeft:-3,background:'#fff'}}></div>
      </${Box}>`} />

    <div style=${{marginTop:60}}>
      <div style=${{fontSize:48,fontWeight:800,color:'#fff',marginBottom:30}}>Great for</div>
      <div style=${{display:'flex',flexWrap:'wrap',gap:20}}>
        ${USES.map(u => html`<span key=${u} style=${{color:'#cfe9ff',border:'1px solid rgba(65,224,255,.35)',fontSize:34,fontWeight:600,padding:'16px 30px',borderRadius:999}}>${u}</span>`)}
      </div>
    </div>

    <div style=${{textAlign:'center',marginTop:90,fontSize:46,fontWeight:800,color:'#fff',letterSpacing:3}}>CONTOUR</div>
  </div>`;
}
mount(html`<${App}/>`);
</script>
</body>
</html>
