<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #root { width: 1200px; height: 1500px; overflow: hidden; }
</style>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/htm.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { html, T, Chair, Phone, GlowDefs, mount } = UI;

function Grid() {
  const lines = [];
  for (let i = 1; i < 6; i++) lines.push(html`<div key=${'v'+i} style=${{position:'absolute',left:(i*16.6)+'%',top:0,bottom:0,width:1,background:'rgba(255,255,255,.06)'}}></div>`);
  for (let i = 1; i < 9; i++) lines.push(html`<div key=${'h'+i} style=${{position:'absolute',top:(i*11)+'%',left:0,right:0,height:1,background:'rgba(255,255,255,.06)'}}></div>`);
  return html`<div style=${{position:'absolute',inset:0}}>${lines}</div>`;
}

function Screen() {
  return html`<div style=${{position:'absolute',inset:0,background:'radial-gradient(120% 100% at 50% 20%, #2a3550 0%, #0e1320 70%)'}}>
    <${Grid}/>
    <!-- the "real" subject from the live camera -->
    <div style=${{position:'absolute',left:'18%',top:'30%',width:'64%',height:'52%',opacity:.92}}>
      <${Chair} mode="photo" color="#9fb0cf" />
    </div>
    <!-- the contour overlay traced from the old photo, offset to show alignment -->
    <div style=${{position:'absolute',left:'22%',top:'27%',width:'64%',height:'52%'}}>
      <svg viewBox="0 0 1 1" style=${{width:0,height:0}}><${GlowDefs}/></svg>
      <${Chair} mode="line" color=${T.glow} glow=${true} />
    </div>
    <div style=${{position:'absolute',left:0,right:0,bottom:24,textAlign:'center',color:'#fff',fontFamily:T.font,fontSize:22,fontWeight:600,opacity:.92}}>
      move until the glowing outline lines up
    </div>
  </div>`;
}

function Callout({ x, y, w, title, sub, align }) {
  return html`<div style=${{position:'absolute',left:x,top:y,width:w,textAlign:align||'left'}}>
    <div style=${{color:T.glow,fontFamily:T.font,fontSize:24,fontWeight:800}}>${title}</div>
    <div style=${{color:'#aeb9cc',fontFamily:T.font,fontSize:20,marginTop:6,lineHeight:1.3}}>${sub}</div>
  </div>`;
}

function App() {
  return html`<div style=${{width:1200,height:1500,background:'linear-gradient(180deg,#070a12 0%,#0d1322 100%)',fontFamily:T.font,position:'relative'}}>
    <div style=${{position:'absolute',top:64,left:0,right:0,textAlign:'center'}}>
      <div style=${{color:'#fff',fontSize:34,fontWeight:800,letterSpacing:6}}>CONTOUR</div>
    </div>
    <div style=${{position:'absolute',top:150,left:0,right:0,textAlign:'center'}}>
      <div style=${{color:'#fff',fontSize:64,fontWeight:800,lineHeight:1.05}}>Retake the exact<br/>same shot</div>
    </div>

    <div style=${{position:'absolute',top:330,left:'50%',transform:'translateX(-50%)'}}>
      <${Phone} width=${380}><${Screen}/><//>
    </div>

    <${Callout} x=${70} y=${430} w=${230} align="right"
      title="Your old photo" sub="traced into glowing contours" />
    <${Callout} x=${900} y=${430} w=${240} align="left"
      title="Live camera" sub="the scene in front of you right now" />
    <${Callout} x=${70} y=${720} w=${230} align="right"
      title="Same angle" sub="distance & framing matched" />
    <${Callout} x=${900} y=${760} w=${240} align="left"
      title="Tap once" sub="capture the aligned shot" />

    <div style=${{position:'absolute',bottom:70,left:0,right:0,display:'flex',justifyContent:'center',gap:18}}>
      ${[['1','Load a photo'],['2','Line up the contours'],['3','Capture']].map(s => html`
        <div key=${s[0]} style=${{display:'flex',alignItems:'center',gap:12,background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:999,padding:'14px 22px'}}>
          <div style=${{width:34,height:34,borderRadius:999,background:T.glow,color:'#06202a',fontWeight:800,fontSize:20,display:'flex',alignItems:'center',justifyContent:'center'}}>${s[0]}</div>
          <div style=${{color:'#fff',fontSize:21,fontWeight:600}}>${s[1]}</div>
        </div>`)}
    </div>
  </div>`;
}
mount(html`<${App}/>`);
</script>
</body>
</html>
