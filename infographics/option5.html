<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #root { width: 1200px; height: 1500px; overflow: hidden; }
</style>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/htm.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { html, T, Person, mount } = UI;

function Frame({ day, build }) {
  return html`<div style=${{flex:1,position:'relative',height:660,borderRadius:24,background:'linear-gradient(180deg,#161b29,#0f1320)',border:'1px solid rgba(255,255,255,.08)',overflow:'hidden',display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
    <div style=${{position:'absolute',top:0,bottom:0,left:'50%',width:2,marginLeft:-1,background:'repeating-linear-gradient(180deg, rgba(65,224,255,.5) 0 8px, transparent 8px 16px)'}}></div>
    <div style=${{width:'74%',height:'82%',position:'relative'}}><${Person} mode="photo" color="#9fb0cf" build=${build} /></div>
    <div style=${{position:'absolute',top:14,left:'50%',transform:'translateX(-50%)',background:T.accent,color:'#fff',fontSize:18,fontWeight:800,padding:'6px 16px',borderRadius:999,whiteSpace:'nowrap'}}>${day}</div>
  </div>`;
}

function App() {
  const frames = [["Day 1",1.2],["Day 30",1.05],["Day 60",0.95],["Day 90",0.85]];
  return html`<div style=${{width:1200,height:1500,background:'linear-gradient(180deg,#070a12,#0d1322)',fontFamily:T.font,padding:'80px 60px',display:'flex',flexDirection:'column'}}>
    <div style=${{textAlign:'center'}}>
      <div style=${{color:'#fff',fontSize:62,fontWeight:800,lineHeight:1.05}}>Track real change</div>
      <div style=${{color:T.glow,fontSize:62,fontWeight:800,lineHeight:1.05}}>perfectly aligned</div>
      <div style=${{color:'#aeb9cc',fontSize:26,marginTop:20}}>Same angle, same framing — so the only thing that changes is you.</div>
    </div>

    <div style=${{display:'flex',gap:22,marginTop:60}}>
      ${frames.map(f => html`<${Frame} key=${f[0]} day=${f[0]} build=${f[1]} />`)}
    </div>

    <div style=${{display:'flex',alignItems:'center',gap:16,marginTop:46}}>
      <div style=${{flex:1,height:3,background:'linear-gradient(90deg,rgba(65,224,255,.2),'+T.glow+')'}}></div>
      <div style=${{color:'#fff',fontSize:22,fontWeight:700,whiteSpace:'nowrap'}}>every frame, the exact same shot</div>
      <div style=${{color:T.glow,fontSize:30}}>→</div>
    </div>

    <div style=${{textAlign:'center',marginTop:'auto',color:'#fff',fontSize:30,fontWeight:800,letterSpacing:3}}>CONTOUR</div>
  </div>`;
}
mount(html`<${App}/>`);
</script>
</body>
</html>
