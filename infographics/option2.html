<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #root { width: 1200px; height: 1500px; overflow: hidden; }
</style>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/htm.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { html, T, Chair, Person, Plant, mount } = UI;

function Half({ children, label, labelBg, bg }) {
  return html`<div style=${{position:'relative',flex:1,height:'100%',background:bg,display:'flex',alignItems:'flex-end',justifyContent:'center',overflow:'hidden'}}>
    <div style=${{width:'58%',height:'82%'}}>${children}</div>
    <div style=${{position:'absolute',top:14,left:14,background:labelBg,color:'#fff',fontSize:15,fontWeight:800,letterSpacing:.6,padding:'5px 12px',borderRadius:999}}>${label}</div>
  </div>`;
}

function Pair({ category, before, after }) {
  return html`<div style=${{marginBottom:34}}>
    <div style=${{fontSize:24,fontWeight:800,color:T.accent,marginBottom:12}}>${category}</div>
    <div style=${{position:'relative',height:300,borderRadius:26,overflow:'hidden',display:'flex',boxShadow:'0 18px 40px rgba(20,30,60,.10)'}}>
      <${Half} label="BEFORE" labelBg="rgba(14,17,22,.65)" bg="#EEF2F9">${before}<//>
      <${Half} label="AFTER" labelBg=${T.accent} bg="#E7ECF8">${after}<//>
      <div style=${{position:'absolute',top:0,bottom:0,left:'50%',width:4,marginLeft:-2,background:'#fff'}}></div>
      <div style=${{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:52,height:52,borderRadius:999,background:'#fff',boxShadow:'0 4px 14px rgba(0,0,0,.25)',display:'flex',alignItems:'center',justifyContent:'center',color:T.accent,fontSize:24,fontWeight:900}}>⇄</div>
    </div>
  </div>`;
}

function App() {
  return html`<div style=${{width:1200,height:1500,background:T.paper,fontFamily:T.font,padding:'70px 70px 50px'}}>
    <div style=${{fontSize:64,fontWeight:800,color:T.ink,lineHeight:1.05}}>The same shot.<br/>Every time.</div>
    <div style=${{fontSize:26,color:T.sub,marginTop:18,marginBottom:46,lineHeight:1.35}}>
      Contour lines up a new photo with an old one — angle, distance and framing all matched, so before & after actually compare.
    </div>

    <${Pair} category="Fitness progress"
      before=${html`<${Person} mode="photo" color="#AEBBD4" build=${1.18} />`}
      after=${html`<${Person} mode="photo" color=${T.accent} build=${0.92} />`} />

    <${Pair} category="Plants & growth"
      before=${html`<${Plant} mode="photo" color="#AEBBD4" size=${0.55} />`}
      after=${html`<${Plant} mode="photo" color=${T.green} size=${1.05} />`} />

    <${Pair} category="Restorations & DIY"
      before=${html`<${Chair} mode="photo" color="#B9C0CC" />`}
      after=${html`<${Chair} mode="photo" color=${T.accent} />`} />

    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:10}}>
      <div style=${{fontSize:30,fontWeight:800,color:T.ink,letterSpacing:2}}>CONTOUR</div>
      <div style=${{fontSize:22,fontWeight:700,color:T.sub}}>Free on iPhone</div>
    </div>
  </div>`;
}
mount(html`<${App}/>`);
</script>
</body>
</html>
